name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:sql
      - run: pnpm test:stripe
      - run: pnpm test:min
      - run: pnpm build
      - run: node scripts/check-exports.mjs
      - run: node scripts/check-imports.mjs
      - run: pnpm test:dist
      - run: pnpm docs:check
      - run: node scripts/check-readme.mjs
